apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "incident-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  APP_MESSAGE: {{ .Values.config.message | quote }}
