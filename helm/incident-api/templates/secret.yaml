{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  LAB_SECRET: {{ required "secret.value must be provided when secret.create=true" .Values.secret.value | quote }}
{{- end }}
