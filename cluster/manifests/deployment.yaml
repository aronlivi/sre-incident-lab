apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: sre-lab
  labels:
    app.kubernetes.io/name: incident-api
    app.kubernetes.io/part-of: sre-incident-lab
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-api
        app.kubernetes.io/part-of: sre-incident-lab
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: incident-api
          image: incident-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
