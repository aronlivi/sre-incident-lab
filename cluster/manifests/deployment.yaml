apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: sre-lab
  labels:
    app.kubernetes.io/name: incident-api
    app.kubernetes.io/part-of: sre-incident-lab
    app.kubernetes.io/version: "0.3.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-api
        app.kubernetes.io/part-of: sre-incident-lab
        app.kubernetes.io/version: "0.3.0"
    spec:
      containers:
        - name: incident-api
          image: incident-api:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-api-config
            - secretRef:
                name: incident-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
