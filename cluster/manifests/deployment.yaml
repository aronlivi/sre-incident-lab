apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  labels:
    app: incident-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-api
  template:
    metadata:
      labels:
        app: incident-api
    spec:
      containers:
        - name: incident-api
          image: incident-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
